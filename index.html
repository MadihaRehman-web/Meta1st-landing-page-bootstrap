<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Meta1st Bootstrap</title>
  </head>
  <body class="bg-dark">
    <nav class="navbar navbar-expand-lg p-4 bg-dark navbar-dark">
      <div class="container-fluid">
        <img src="./assets/brand-logo.png" alt="Meta1st.ai" />

        <button
          class="navbar-toggler"
          type="button"
          data-bs-target="#navbarToggler"
          data-bs-toggle="collapse"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          id="navbarToggler"
          class="collapse navbar-collapse d-flex justify-content-end"
        >
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
            <li class="nav-item">
              <a class="nav-link" href="#">Products</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Blogs</a></li>
            <li class="nav-item">
              <a class="nav-link" href="#">Freebies</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Partners</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact us</a>
            </li>
          </ul>
          <div class="d-flex align-items-center">
            <div class="theme-switcher">
              <label for="toggleSwitch" class="switch">
                <input type="checkbox" id="toggleSwitch" class="invisible" />
                <span class="slider"></span>
              </label>
            </div>

            <div class="d-flex">
              <a href="#" class="nav-link text-white">Log in</a>
              <a
                href="#"
                class="nav-link border border-white rounded text-white"
                >Sign up</a
              >
            </div>
          </div>
        </div>
      </div>
    </nav>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
